name: care_id_patient_app
description: "CareID Patient Facing Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/card_id_badge.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/card_id_badge.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/card_id_badge.png"
    background_color: "#ffffff"
    theme_color: "#28006D"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
